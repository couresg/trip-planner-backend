# 로컬 개발용. 값은 .env(환경변수)에서 주입한다.
# 작업 디렉터리가 backend/ 이므로 상위 폴더의 .env를 properties 형식으로 읽는다. OS 환경변수가 있으면 그쪽이 우선한다.
spring:
  config:
    import: optional:file:../.env[.properties]

logging:
  level:
    com.tripplanner: DEBUG
    # 실행되는 SQL. 바인딩 값까지 보려면 org.hibernate.orm.jdbc.bind: TRACE (토큰 해시 등도 찍히므로 기본은 끔)
    org.hibernate.SQL: DEBUG

app:
  # 요청마다 "메서드 경로 -> 상태 (ms)" 한 줄 (RequestLoggingFilter)
  request-log:
    enabled: true
  cors:
    allowed-origins: http://localhost:5173
