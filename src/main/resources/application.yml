spring:
  application:
    name: trip-planner
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/trip_planner?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true

external:
  mock: ${EXTERNAL_MOCK:true}
  aerodatabox:
    api-key: ${AERODATABOX_API_KEY:}
  google:
    maps-api-key: ${GOOGLE_MAPS_API_KEY:}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
